<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Radar - 관심종목 대시보드</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-2: #0b1424;
      --panel: #111a2b;
      --panel-soft: rgba(22, 30, 46, 0.75);
      --text: #ecf3ff;
      --muted: #93a0b5;
      --accent: #00d4aa;
      --accent-2: #26f7ca;
      --up: #00d4aa;
      --down: #ff5b6e;
      --line: rgba(148, 163, 184, 0.22);
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Pretendard", "Segoe UI", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(1200px 560px at 100% -10%, rgba(0, 212, 170, 0.22) 0%, rgba(0, 212, 170, 0) 65%),
        radial-gradient(900px 460px at -10% 20%, rgba(41, 96, 255, 0.22) 0%, rgba(41, 96, 255, 0) 58%),
        linear-gradient(140deg, var(--bg) 0%, var(--bg-2) 55%, #0a101c 100%);
      background-attachment: fixed;
    }

    .orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(58px);
      opacity: 0.2;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb.a { background: #00d4aa; top: -120px; right: -80px; }
    .orb.b { background: #2d66ff; bottom: -160px; left: -120px; animation-delay: 1.8s; }

    @keyframes drift {
      from { transform: translateY(0) translateX(0) scale(1); }
      to { transform: translateY(20px) translateX(14px) scale(1.06); }
    }

    .wrap {
      width: min(1180px, 94vw);
      margin: 24px auto 44px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.25rem, 1.8vw, 1.9rem);
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(17, 26, 43, 0.65);
      font-size: 0.84rem;
      color: #d3deee;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 14px rgba(38, 247, 202, 0.9);
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .panel {
      background: linear-gradient(180deg, rgba(24, 35, 53, 0.86), var(--panel-soft));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(9, 15, 26, 0.95);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    button {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #1f2a3d;
      color: var(--text);
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.18s ease;
    }

    button:hover { border-color: var(--accent); transform: translateY(-1px); }

    .primary {
      border-color: rgba(0, 212, 170, 0.45);
      background: linear-gradient(130deg, rgba(0, 212, 170, 0.22), rgba(0, 212, 170, 0.06));
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .preset {
      font-size: 0.82rem;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(33, 45, 66, 0.95);
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .metric {
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16, 25, 40, 0.9), rgba(11, 18, 30, 0.82));
      padding: 12px;
    }

    .metric .k {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .metric .v {
      font-size: 1.3rem;
      margin-top: 8px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(15, 24, 39, 0.94), rgba(11, 18, 29, 0.88));
      padding: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      transform-origin: center;
      animation: cardIn 0.24s ease;
    }

    @keyframes cardIn {
      from { transform: translateY(8px) scale(0.99); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .card.flash-up { animation: flashUp 0.65s ease; }
    .card.flash-down { animation: flashDown 0.65s ease; }

    @keyframes flashUp {
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.42); }
      100% { box-shadow: 0 0 0 16px rgba(0, 212, 170, 0); }
    }

    @keyframes flashDown {
      0% { box-shadow: 0 0 0 0 rgba(255, 91, 110, 0.36); }
      100% { box-shadow: 0 0 0 16px rgba(255, 91, 110, 0); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -50% auto auto -25%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(255,255,255,0));
      pointer-events: none;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .symbol {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .remove {
      background: transparent;
      border-radius: 8px;
      font-size: 0.76rem;
      padding: 6px 8px;
    }

    .price {
      margin: 12px 0 8px;
      font-size: 1.56rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      margin-top: 6px;
      color: #d6deea;
    }

    .row .key { color: var(--muted); }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .trend {
      margin-top: 12px;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(8, 12, 20, 0.9);
    }

    .trend > span {
      display: block;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, rgba(0, 212, 170, 0.36), rgba(38, 247, 202, 0.92));
      transition: width 0.3s ease;
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(11, 18, 29, 0.65);
    }

    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .controls input { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="wrap">
    <header class="topbar">
      <div>
        <h1 class="title">Market Radar</h1>
        <div class="subtitle">관심종목 실시간 모니터링 대시보드</div>
      </div>
      <div class="live-pill"><span class="dot"></span> 30초 자동 갱신</div>
    </header>

    <section class="panel">
      <div class="controls">
        <input id="symbolInput" type="text" maxlength="6" placeholder="종목코드 6자리 입력 (예: 286940)" />
        <button id="addBtn" class="primary">종목 추가</button>
        <button id="refreshBtn">지금 새로고침</button>
      </div>
      <div id="presets" class="presets"></div>
      <div class="hint">최대 10개 종목 저장, 로컬 스토리지에 자동 보관됩니다.</div>
    </section>

    <section id="summary" class="summary-grid"></section>
    <section id="cards" class="cards"></section>
  </main>

  <script>
    const STORAGE_KEY = "watchSymbols";
    const MAX_SYMBOLS = 10;
    const REFRESH_MS = 30000;

    const PRESETS = [
      { name: "롯데이노베이트", symbol: "286940" },
      { name: "삼성전자", symbol: "005930" },
      { name: "SK하이닉스", symbol: "000660" },
      { name: "NAVER", symbol: "035420" },
      { name: "카카오", symbol: "035720" },
      { name: "LG에너지솔루션", symbol: "373220" },
      { name: "POSCO홀딩스", symbol: "005490" },
      { name: "현대차", symbol: "005380" }
    ];

    const symbolInput = document.getElementById("symbolInput");
    const addBtn = document.getElementById("addBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const presetsEl = document.getElementById("presets");
    const cardsEl = document.getElementById("cards");
    const summaryEl = document.getElementById("summary");

    let symbols = loadSymbols();
    let prevPrices = {};
    let refreshTimer = null;

    function loadSymbols() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(isValidSymbol).slice(0, MAX_SYMBOLS) : [];
      } catch {
        return [];
      }
    }

    function saveSymbols() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    }

    function isValidSymbol(symbol) {
      return /^\d{6}$/.test(symbol);
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("ko-KR");
    }

    function addSymbol(symbol) {
      if (!isValidSymbol(symbol)) {
        alert("종목코드는 6자리 숫자여야 합니다.");
        return;
      }
      if (symbols.includes(symbol)) return;
      if (symbols.length >= MAX_SYMBOLS) {
        alert("최대 10개 종목까지만 추가할 수 있습니다.");
        return;
      }
      symbols.push(symbol);
      saveSymbols();
      fetchAll();
    }

    function removeSymbol(symbol) {
      symbols = symbols.filter((s) => s !== symbol);
      delete prevPrices[symbol];
      saveSymbols();
      fetchAll();
    }

    function renderPresets() {
      presetsEl.innerHTML = "";
      PRESETS.forEach((preset) => {
        const btn = document.createElement("button");
        btn.className = "preset";
        btn.textContent = `${preset.name} (${preset.symbol})`;
        btn.addEventListener("click", () => addSymbol(preset.symbol));
        presetsEl.appendChild(btn);
      });
    }

    function renderSummary(data) {
      const total = data.length;
      const ups = data.filter((d) => d.rate > 0).length;
      const downs = data.filter((d) => d.rate < 0).length;
      const avg = total ? data.reduce((acc, d) => acc + (d.rate || 0), 0) / total : 0;

      summaryEl.innerHTML = `
        <div class="metric"><div class="k">종목 수</div><div class="v">${total}</div></div>
        <div class="metric"><div class="k">상승</div><div class="v up">${ups}</div></div>
        <div class="metric"><div class="k">하락</div><div class="v down">${downs}</div></div>
        <div class="metric"><div class="k">평균 등락률</div><div class="v ${avg >= 0 ? "up" : "down"}">${avg.toFixed(2)}%</div></div>
      `;
    }

    function getTrendWidth(rate) {
      const normalized = Math.min(10, Math.max(-10, rate || 0));
      return `${50 + normalized * 5}%`;
    }

    function renderCards(items) {
      cardsEl.innerHTML = "";

      if (!items.length) {
        cardsEl.innerHTML = '<div class="empty">관심종목을 추가하면 실시간 카드가 표시됩니다.</div>';
        return;
      }

      items.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        const directionClass = item.rate > 0 ? "up" : item.rate < 0 ? "down" : "";
        const signedChange = item.change > 0 ? `+${formatNumber(item.change)}` : item.change < 0 ? `-${formatNumber(Math.abs(item.change))}` : "0";
        const signedRate = item.rate > 0 ? `+${item.rate.toFixed(2)}%` : `${item.rate.toFixed(2)}%`;

        const prev = prevPrices[item.symbol];
        if (typeof prev === "number" && prev !== item.price) {
          card.classList.add(item.price > prev ? "flash-up" : "flash-down");
        }
        prevPrices[item.symbol] = item.price;

        card.innerHTML = `
          <div class="head">
            <div>
              <div class="name">${item.name}</div>
              <div class="symbol">${item.symbol}</div>
            </div>
            <button class="remove" data-symbol="${item.symbol}">삭제</button>
          </div>
          <div class="price">${formatNumber(item.price)}원</div>
          <div class="row ${directionClass}"><span class="key">등락률</span><strong>${signedRate}</strong></div>
          <div class="row ${directionClass}"><span class="key">등락금액</span><strong>${signedChange}원</strong></div>
          <div class="row"><span class="key">거래량</span><strong>${formatNumber(item.volume)}</strong></div>
          <div class="trend"><span style="width:${getTrendWidth(item.rate)}"></span></div>
        `;

        cardsEl.appendChild(card);
      });

      cardsEl.querySelectorAll(".remove").forEach((btn) => {
        btn.addEventListener("click", () => removeSymbol(btn.dataset.symbol));
      });
    }

    async function fetchStock(symbol) {
      const res = await fetch(`/api/stock?symbol=${symbol}`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    async function fetchAll() {
      if (!symbols.length) {
        renderSummary([]);
        renderCards([]);
        return;
      }

      const results = await Promise.all(
        symbols.map(async (symbol) => {
          try {
            return await fetchStock(symbol);
          } catch {
            return {
              symbol,
              name: `${symbol} (오류)`,
              price: 0,
              change: 0,
              rate: 0,
              volume: 0,
              timestamp: new Date().toISOString()
            };
          }
        })
      );

      renderSummary(results);
      renderCards(results);
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchAll, REFRESH_MS);
    }

    function initEvents() {
      addBtn.addEventListener("click", () => {
        addSymbol(symbolInput.value.trim());
        symbolInput.value = "";
      });

      symbolInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addBtn.click();
      });

      refreshBtn.addEventListener("click", fetchAll);
    }

    function init() {
      renderPresets();
      initEvents();
      fetchAll();
      startAutoRefresh();
    }

    init();
  </script>
</body>
</html>
